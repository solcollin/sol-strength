<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOL STRENGTH">
  <meta name="description" content="Private offline-first workout tracking with immediate 5/3/1 programming.">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>SOL STRENGTH</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">S</span><span>SOL <b>STRENGTH</b></span></div>
      <span class="offline-indicator" id="connection">ON DEVICE</span>
    </header>
    <div id="storage-warning" class="warning" hidden role="alert"></div>
    <main id="screen" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation" hidden>
      <button class="tab active" data-tab="today" aria-label="Workout"><span class="tab-icon">▦</span>Workout</button>
      <button class="tab" data-tab="history" aria-label="History"><span class="tab-icon">◷</span>History</button>
      <button class="tab" data-tab="settings" aria-label="Settings"><span class="tab-icon">☷</span>Settings</button>
    </nav>
    <div id="timer-bar" class="timer-bar" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
