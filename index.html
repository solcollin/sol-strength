<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOL STRENGTH">
  <meta name="description" content="A private, offline-first strength training log with 5/3/1 programming.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>SOL STRENGTH</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="wordmark" aria-label="SOL STRENGTH">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>SOL<span>STRENGTH</span></strong><small>BUILD. LOG. PROGRESS.</small></span>
      </div>
      <span class="connection" id="connection"><i></i><span>LOCAL FIRST</span></span>
    </header>
    <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
    <main id="screen" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-tab="today" aria-label="Workout" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5v14M3 9v6M21 9v6M6 12h12"/></svg><span>Workout</span></button>
      <button class="tab" data-tab="program" aria-label="Program"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 4v16M20 4v16M3 8h19M3 16h19"/></svg><span>Program</span></button>
      <button class="tab" data-tab="history" aria-label="History"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/></svg><span>History</span></button>
      <button class="tab" data-tab="progress" aria-label="Progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V7M16 20V13M22 20V4M2 20h21"/></svg><span>Progress</span></button>
      <button class="tab" data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg><span>Settings</span></button>
    </nav>
    <div id="timer-bar" class="timer-bar" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
